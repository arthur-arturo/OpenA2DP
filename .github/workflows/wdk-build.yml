name: WDK profile driver build

on:
  push:
  pull_request:

jobs:
  build-kmdf:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build KMDF AVDTP profile driver
        shell: pwsh
        run: |
          $wdk = "C:\Program Files (x86)\Windows Kits\10"
          $wdkBin = "$wdk\bin\10.0.26100.0\"
          msbuild driver/opena2dp/opena2dp.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:WDKContentRoot="$wdk\" /p:WDKBuildFolder=10.0.26100.0 /p:WindowsSDKVersionedBinRoot="$wdkBin"
